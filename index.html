<!doctype html>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%236c4cf1'/%3E%3Cpath d='M16 14h32v8H25v7h20v8H25v7h23v8H16z' fill='white'/%3E%3C/svg%3E">

<style>
:root{--bg:#faf9fc;--ink:#1a1821;--muted:#7b7885;--line:#e8e5ef;--accent:#6c4cf1;--soft:#f1edff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 15% 10%,#eee9ff,transparent 40%),radial-gradient(ellipse at 90% 90%,#ffe9f1,transparent 35%),var(--bg);font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink)}.wrap{width:min(100%,430px)}.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-size:25px;font-weight:900;letter-spacing:-1px}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--accent);color:white}.sub{text-align:center;color:var(--muted);margin:8px 0 22px}.card{background:#ffffffeb;border:1px solid var(--line);border-radius:22px;padding:27px;box-shadow:0 20px 70px #321d6610}h1{font-size:29px;letter-spacing:-1px;margin:0 0 4px}p{color:var(--muted)}button,input{font:inherit}button{cursor:pointer}.btn{width:100%;padding:12px 14px;border-radius:12px;border:0;background:var(--accent);color:white;font-weight:800}.oauth{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;margin-top:9px}.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}.field label{font-size:13px;font-weight:750}.field input{width:100%;padding:12px;border:1px solid #dfdce8;border-radius:11px;outline:none}.field input:focus{border-color:var(--accent)}.divider{display:flex;align-items:center;gap:12px;color:#999;font-size:11px;margin:19px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.links{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-top:16px}.links a{color:var(--accent);font-weight:750;text-decoration:none}.foot{text-align:center;color:#9a98a2;font-size:12px;margin-top:18px}.hidden{display:none!important}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 16px;border-radius:12px;background:#19181f;color:white;max-width:90vw}
body.dark{--bg:#111116;--ink:#f4f2fa;--muted:#aaa6b6;--line:#302e3a;--accent:#9b86ff;--soft:#2b2540;background:var(--bg)}body.dark .card,body.dark .oauth,body.dark .field input{background:#1b1a22;color:var(--ink);border-color:var(--line)}.logo svg{width:20px;height:20px}button{display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1}button svg,.logo svg{display:block;flex:0 0 auto;vertical-align:middle}</style></head><body><main class="wrap"><div class="brand"><span class="logo"><i data-lucide="layers"></i></span>RIVET</div><button class="oauth" style="margin:14px 0" type="button" onclick="toggleTheme()"><i data-lucide="moon-star"></i> Toggle dark mode</button><p class="sub">A quieter kind of social.</p><section class="card" id="authcard"><h1 id="heading">Welcome back.</h1><p id="intro">Sign in to your corner of the internet.</p><button class="oauth" onclick="oauth('google')">Continue with Google</button><button class="oauth" onclick="oauth('github')">Continue with GitHub</button><div class="divider">OR WITH EMAIL</div>

<script>
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('rivet-auth-theme',document.body.classList.contains('dark')?'dark':'light')}if(localStorage.getItem('rivet-auth-theme')==='dark')document.body.classList.add('dark');
const SUPABASE_URL="https://szbrcnmvjxypfoqdwrgr.supabase.co",SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6YnJjbm12anh5cGZvcWR3cmdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MDMzMzIsImV4cCI6MjEwODA3OTMzMn0.YZ7_3yQ77F06ZUH4yb1O0emf-Bz1C5ZTy7SzRK2lqo4";
const sharedAuthStorage={getItem:async(key)=>{const prefix=encodeURIComponent(key)+'=';const parts=document.cookie.split('; ').filter(x=>x.startsWith(prefix));return parts.length?decodeURIComponent(parts[0].slice(prefix.length)):null},setItem:async(key,value)=>{document.cookie=encodeURIComponent(key)+'='+encodeURIComponent(value)+'; Domain=.userivet.net; Path=/; Max-Age=31536000; Secure; SameSite=Lax'},removeItem:async(key)=>{document.cookie=encodeURIComponent(key)+'=; Domain=.userivet.net; Path=/; Max-Age=0; Secure; SameSite=Lax'}};
const sb=(window.supabase&&!SUPABASE_URL.includes("YOUR_PROJECT_REF")&&!SUPABASE_ANON_KEY.includes("YOUR_"))?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{storage:sharedAuthStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
function isMobileDevice(){return window.matchMedia('(max-width: 800px)').matches || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)}function platformUrl(){return isMobileDevice()?'https://m.userivet.net/':'https://userivet.net/'}const $=s=>document.querySelector(s);function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3000)}if(window.lucide)lucide.createIcons();let mode='signin';function setMode(m){mode=m;$('#heading').textContent=({signin:'Welcome back.',signup:'Create your account',reset:'Reset password',verify:'Verify your email'})[m];$('#intro').textContent=({signin:'Sign in to your corner of the internet.',signup:'Join a quieter corner of the internet.',reset:'We’ll send a recovery link to your account email.',verify:'Enter the code sent to your email.'})[m];$('#submit').textContent=({signin:'Sign in',signup:'Create account',reset:'Send recovery email',verify:'Verify code'})[m];$('#switch').textContent=m==='signin'?'Create an account':'Back to sign in';$('#passwordfield').classList.toggle('hidden',m==='reset'||m==='verify');$('#email').classList.toggle('hidden',m==='verify');$('#password').required=m==='signin'||m==='signup';if(m==='verify'){$('#form').innerHTML='<div class="field"><label for="otp">Verification code</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" required placeholder="Enter email code"></div><button class="btn">Verify code</button>'}else{$('#form').innerHTML='<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>'+(m==='reset'?'':'<div class="field" id="passwordfield"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters"></div>')+'<button class="btn" id="submit">'+({signin:'Sign in',signup:'Create account',reset:'Send recovery email'})[m]+'</button>';$('#password')&&($('#password').required=m==='signin'||m==='signup')}$('#form').onsubmit=submitForm}
async function submitForm(e){e.preventDefault();if(!sb){toast('Configure your Supabase URL and anon key first.');return}const email=$('#email')?.value;const password=$('#password')?.value;if(mode==='signin'){const {error}=await sb.auth.signInWithPassword({email,password});if(error)toast(error.message);else location.href=platformUrl()}else if(mode==='signup'){const {error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:'https://auth.userivet.net/'}});if(error)toast(error.message);else{toast('Verification code sent. Enter it here.');setMode('verify')}}else if(mode==='reset'){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://userivet.net/#settings'});toast(error?error.message:'Recovery email sent.')}else if(mode==='verify'){const token=$('#otp').value;const {error}=await sb.auth.verifyOtp({email:window.pendingEmail||email,token,type:'signup'});if(error)toast(error.message);else location.href=platformUrl()}}
async function oauth(provider){if(!sb){toast('Configure Supabase URL and anon key first.');return}const {error}=await sb.auth.signInWithOAuth({provider,options:{redirectTo:'https://auth.userivet.net/'}});if(error)toast(error.message)}
$('#switch').onclick=e=>{e.preventDefault();setMode(mode==='signin'?'signup':'signin')};document.querySelector('a[href="#reset"]').onclick=e=>{e.preventDefault();setMode('reset')};$('#form').onsubmit=submitForm;setMode('signin');(async()=>{if(!sb)return;const {data:{session}}=await sb.auth.getSession();if(session)location.replace(platformUrl())})();
</script></body></html>
